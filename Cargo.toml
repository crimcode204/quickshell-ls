[package]
name = "quickshell-ls"
version = "0.1.0"
edition = "2024"

[dependencies]
crop = "0.4.3"
dashmap = "6.2.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-lsp = { version = "0.20.0", features = ["proposed"] }
tree-sitter = "0.27.0"
tree-sitter-qmljs = "0.3.1"

[[bin]]
name = "qt_docs_scraper"
path = "src/bin/qt_docs_scraper.rs"
